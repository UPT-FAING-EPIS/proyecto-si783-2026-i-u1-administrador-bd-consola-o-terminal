[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusdb-mcp-server"
version = "0.1.0"
description = "Servidor MCP que expone conectores de bases de datos (SQLite, PostgreSQL, MySQL) de NexusDB a asistentes de IA compatibles con Model Context Protocol."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dayan Elvis Jahuira Pilco" }
]
keywords = ["mcp", "model-context-protocol", "database", "sql", "ai-agent"]
dependencies = [
    "mcp>=1.0.0",
    "psycopg2-binary>=2.9",
    "mysql-connector-python>=8.0",
]

[project.scripts]
nexusdb-mcp-server = "nexusdb_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusdb_mcp_server"]
